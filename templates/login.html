{% extends "base.html" %}
{% block content %}
  <div class="card" style="max-width:420px;margin:12vh auto;padding:18px">
    <div style="font-weight:900;font-size:22px">CRM Facilite</div>
    <div class="muted" style="margin-top:6px">Acesso restrito</div>

    <form method="post" style="margin-top:14px">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}" />
      <div style="margin-top:10px">
        <div class="muted" style="font-weight:700">Email</div>
        <input class="input" name="email" placeholder="seu@email.com" />
      </div>
      <div style="margin-top:10px">
        <div class="muted" style="font-weight:700">Senha</div>
        <input class="input" name="password" type="password" />
      </div>
      {% if error %}<div style="margin-top:10px;color:#dc2626;font-weight:700">{{ error }}</div>{% endif %}
      <button class="btn primary" style="width:100%;margin-top:14px" type="submit">Entrar</button>
    </form>
  </div>
{% endblock %}
